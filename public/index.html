<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>作品タイトル | Special Book</title>
  <!-- Google Fonts: フォント読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #faf9f6; /* 温かみのあるオフホワイト */
      --text-main: #1a1a1a;
      --text-sub: #666666;
      --accent-color: #2b2b2b;
      --border-color: #e5e3db;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans JP', 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.7;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    header h1 {
      font-size: 1.1rem;
      letter-spacing: 0.2em;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 400;
    }

    .product-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: start;
      background: var(--card-bg);
      padding: 50px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
      border: 1px solid var(--border-color);
    }

    @media (max-width: 768px) {
      .product-layout {
        grid-template-columns: 1fr;
        padding: 25px;
        gap: 30px;
      }
    }

    /* 写真ギャラリーエリア */
    .gallery-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* メインの大きな写真 */
    .main-photo {
      width: 100%;
      aspect-ratio: 3 / 4;
      background-color: #eae7df;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .main-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* サムネイル（複数の小さい写真）のグリッド */
    .sub-photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .sub-photo-item {
      aspect-ratio: 1 / 1;
      background-color: #eae7df;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--border-color);
      transition: opacity 0.2s;
    }

    .sub-photo-item:hover {
      opacity: 0.8;
    }

    .sub-photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 商品情報エリア */
    .product-info h2 {
      font-size: 1.8rem;
      font-weight: 500;
      margin-bottom: 15px;
      letter-spacing: 0.03em;
    }

    .price {
      font-size: 1.4rem;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 25px;
    }

    .description {
      font-size: 0.95rem;
      color: var(--text-sub);
      margin-bottom: 30px;
    }

    /* フォーム周り */
    .checkout-form {
      border-top: 1px solid var(--border-color);
      padding-top: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      border-radius: 6px;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent-color);
    }

    .buy-button {
      width: 100%;
      background-color: var(--text-main);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 15px;
      letter-spacing: 0.05em;
      transition: background-color 0.2s, transform 0.1s;
    }

    .buy-button:hover {
      background-color: #333;
    }

    .buy-button:active {
      transform: scale(0.99);
    }

    .note {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Independent Publication</h1>
    </header>

    <main class="product-layout">
      <!-- 左側：複数写真が置けるギャラリーエリア -->
      <div class="gallery-container">
        <!-- メインの大きな写真 -->
        <div class="main-photo">
          <img src="cover1.jpg" alt="メイン写真">
        </div>
        <!-- 下部に並ぶ複数のサブ写真（サムネイル） -->
        <div class="sub-photos">
          <div class="sub-photo-item">
            <img src="cover2.jpg" alt="サンプル写真1">
          </div>
          <div class="sub-photo-item">
            <img src="cover3.jpg" alt="サンプル写真2">
          </div>
          <div class="sub-photo-item">
            <img src="cover4.jpg" alt="サンプル写真3">
          </div>
        </div>
      </div>

      <!-- 右側：詳細 ＆ 購入フォーム -->
      <div class="product-info">
        <h2>作品タイトルが入ります</h2>
        <div class="price">¥2,200 <span style="font-size: 0.8rem; color: var(--text-sub);">（税込 / 送料込）</span></div>
        <p class="description">
          ここに本の紹介文やこだわりが入ります。ページ数やサイズ感、どんな想いで作った一冊なのかを簡潔に、スマートに伝えるスペースです。
        </p>

        <!-- 購入入力フォーム -->
        <form class="checkout-form" action="/api/create-checkout-session" method="POST">
          <div class="form-group">
            <label for="name">お名前</label>
            <input type="text" id="name" name="name" placeholder="山田 太郎" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="postal">郵便番号</label>
              <input type="text" id="postal" name="postal" placeholder="530-0001" required>
            </div>
            <div class="form-group">
              <label for="phone">電話番号</label>
              <input type="text" id="phone" name="phone" placeholder="09012345678" required>
            </div>
          </div>

          <div class="form-group">
            <label for="address">お届け先住所</label>
            <input type="text" id="address" name="address" placeholder="大阪府大阪市北区〇〇 1-2-3" required>
          </div>

          <div class="form-group">
            <label for="email">メールアドレス（受領確認用）</label>
            <input type="email" id="email" name="email" placeholder="example@email.com" required>
          </div>

          <button type="submit" class="buy-button">クレジットカードで進む</button>
          <p class="note">※決済画面（Stripe等）へ移動します</p>
        </form>
      </div>
    </main>
  </div>

</body>
</html>
