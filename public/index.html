<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>作品販売ページ | Special Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #faf9f6;
      --text-main: #1a1a1a;
      --text-sub: #666666;
      --accent-color: #2b2b2b;
      --border-color: #e5e3db;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans JP', 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.7;
      padding: 40px 20px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    header h1 {
      font-size: 1.2rem;
      letter-spacing: 0.2em;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 400;
    }

    /* 商品セクションを並べるグリッド */
    .products-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    @media (max-width: 768px) {
      .products-grid {
        grid-template-columns: 1fr;
      }
    }

    .product-card {
      background: var(--card-bg);
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 写真ギャラリーエリア */
    .gallery-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    .main-photo {
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: #eae7df;
      border-radius: 8px;
      overflow: hidden;
    }

    .main-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sub-photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .sub-photo-item {
      aspect-ratio: 1 / 1;
      background-color: #eae7df;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .sub-photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 商品情報エリア */
    .product-info h2 {
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 10px;
      letter-spacing: 0.03em;
    }

    .price {
      font-size: 1.3rem;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 15px;
    }

    .description {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 25px;
    }

    /* フォーム・入力欄 */
    .checkout-form {
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 4px;
      font-weight: 500;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      border-radius: 6px;
      font-size: 0.9rem;
      color: var(--text-main);
      outline: none;
    }

    input:focus {
      border-color: var(--accent-color);
    }

    .buy-button {
      width: 100%;
      background-color: var(--text-main);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 10px;
      letter-spacing: 0.05em;
      transition: background-color 0.2s;
    }

    .buy-button:hover {
      background-color: #444;
    }

    .note {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-sub);
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Independent Publication & Goods</h1>
    </header>

    <div class="products-grid">
      
      <!-- 1. 本のカード -->
      <div class="product-card">
        <div>
          <!-- 本の写真ギャラリー (book1.jpg, book2.jpg などに変更してね) -->
          <div class="gallery-container">
            <div class="main-photo">
              <img src="book1.jpg" alt="本のメイン画像">
            </div>
            <div class="sub-photos">
              <div class="sub-photo-item"><img src="book2.jpg" alt="本サンプル1"></div>
              <div class="sub-photo-item"><img src="book3.jpg" alt="本サンプル2"></div>
              <div class="sub-photo-item"><img src="book4.jpg" alt="本サンプル3"></div>
            </div>
          </div>

          <h2>作品タイトル（本）</h2>
          <div class="price">¥1,050 <span style="font-size: 0.75rem; color: var(--text-sub);">（税込 / 送料込）</span></div>
          <p class="description">
            ここに本の紹介文が入ります。ページ数やこだわりを記載するスペースです。
          </p>
        </div>

        <!-- 本の購入フォーム -->
        <form class="checkout-form" action="/api/create-checkout-session" method="POST">
          <input type="hidden" name="product_type" value="book">
          <div class="form-group">
            <label for="name-book">お名前</label>
            <input type="text" id="name-book" name="name" placeholder="山田 太郎" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="postal-book">郵便番号</label>
              <input type="text" id="postal-book" name="postal" placeholder="530-0001" required>
            </div>
            <div class="form-group">
              <label for="phone-book">電話番号</label>
              <input type="text" id="phone-book" name="phone" placeholder="09012345678" required>
            </div>
          </div>
          <div class="form-group">
            <label for="address-book">お届け先住所</label>
            <input type="text" id="address-book" name="address" placeholder="大阪府大阪市北区〇〇 1-2-3" required>
          </div>
          <div class="form-group">
            <label for="email-book">メールアドレス</label>
            <input type="email" id="email-book" name="email" placeholder="example@email.com" required>
          </div>
          <button type="submit" class="buy-button">本を注文する</button>
          <p class="note">※Stripeの安全な決済画面へ移動します</p>
        </form>
      </div>

      <!-- 2. かるたのカード -->
      <div class="product-card">
        <div>
          <!-- かるたの写真ギャラリー (karuta1.jpg, karuta2.jpg などに変更してね) -->
          <div class="gallery-container">
            <div class="main-photo">
              <img src="karuta1.jpg" alt="かるたのメイン画像">
            </div>
            <div class="sub-photos">
              <div class="sub-photo-item"><img src="karuta2.jpg" alt="かるたサンプル1"></div>
              <div class="sub-photo-item"><img src="karuta3.jpg" alt="かるたサンプル2"></div>
              <div class="sub-photo-item"><img src="karuta4.jpg" alt="かるたサンプル3"></div>
            </div>
          </div>

          <h2>オリジナルかるた</h2>
          <div class="price">¥2,070 <span style="font-size: 0.75rem; color: var(--text-sub);">（税込 / 送料込）</span></div>
          <p class="description">
            ここにかるたのこだわりや内容物の紹介文が入ります。写真で雰囲気をお伝えできます。
          </p>
        </div>

        <!-- かるたの購入フォーム -->
        <form class="checkout-form" action="/api/create-checkout-session" method="POST">
          <input type="hidden" name="product_type" value="karuta">
          <div class="form-group">
            <label for="name-karuta">お名前</label>
            <input type="text" id="name-karuta" name="name" placeholder="山田 太郎" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="postal-karuta">郵便番号</label>
              <input type="text" id="postal-karuta" name="postal" placeholder="530-0001" required>
            </div>
            <div class="form-group">
              <label for="phone-karuta">電話番号</label>
              <input type="text" id="phone-karuta" name="phone" placeholder="09012345678" required>
            </div>
          </div>
          <div class="form-group">
            <label for="address-karuta">お届け先住所</label>
            <input type="text" id="address-karuta" name="address" placeholder="大阪府大阪市北区〇〇 1-2-3" required>
          </div>
          <div class="form-group">
            <label for="email-karuta">メールアドレス</label>
            <input type="email" id="email-karuta" name="email" placeholder="example@email.com" required>
          </div>
          <button type="submit" class="buy-button">かるたを注文する</button>
          <p class="note">※Stripeの安全な決済画面へ移動します</p>
        </form>
      </div>

    </div>
  </div>

</body>
</html>
