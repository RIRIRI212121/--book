<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>手話かるた | Special Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #faf9f6;
      --text-main: #1a1a1a;
      --text-sub: #666666;
      --accent-color: #2b2b2b;
      --border-color: #e5e3db;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans JP', 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.7;
      padding: 40px 20px;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 1.2rem;
      letter-spacing: 0.2em;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 400;
    }

    .product-card {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
      border: 1px solid var(--border-color);
    }

    @media (max-width: 768px) {
      .product-card {
        padding: 25px;
      }
    }

    /* 写真ギャラリーエリア（メイン1枚 ＋ サブ2枚） */
    .gallery-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    .main-photo {
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: #eae7df;
      border-radius: 8px;
      overflow: hidden;
    }

    .main-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sub-photos {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 2枚並び */
      gap: 10px;
    }

    .sub-photo-item {
      aspect-ratio: 4 / 3;
      background-color: #eae7df;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .sub-photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 商品情報エリア */
    .product-info h2 {
      font-size: 1.6rem;
      font-weight: 500;
      margin-bottom: 10px;
      letter-spacing: 0.03em;
    }

    .price {
      font-size: 1.3rem;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 20px;
    }

    .description {
      font-size: 0.95rem;
      color: var(--text-sub);
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* フォーム・入力欄 */
    .checkout-form {
      border-top: 1px solid var(--border-color);
      padding-top: 25px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      border-radius: 6px;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
    }

    input:focus {
      border-color: var(--accent-color);
    }

    .buy-button {
      width: 100%;
      background-color: var(--text-main);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 15px;
      letter-spacing: 0.05em;
      transition: background-color 0.2s;
    }

    .buy-button:hover {
      background-color: #444;
    }

    .note {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Original Goods</h1>
    </header>

    <div class="products-stack">
      
      <!-- かるたのセクション -->
      <div class="product-card">
        <!-- メイン1枚 ＋ サブ2枚のギャラリー (karuta1.jpg, karuta2.jpg, karuta3.jpg) -->
        <div class="gallery-container">
          <div class="main-photo">
            <img src="karuta1.jpg" alt="手話かるた メイン画像">
          </div>
          <div class="sub-photos">
            <div class="sub-photo-item"><img src="karuta2.jpg" alt="手話かるた サブ画像1"></div>
            <div class="sub-photo-item"><img src="karuta3.jpg" alt="手話かるた サブ画像2"></div>
          </div>
        </div>

        <div class="product-info">
          <h2>手話かるた</h2>
          <div class="price">¥2,070 <span style="font-size: 0.8rem; color: var(--text-sub);">（税込 / 送料込）</span></div>
          
          <div class="description">
            <p>ろうあ者と手話を学ぶ健常者とがゲームを楽しみながら手話とろうあ問題を学ぶためのかるたです。</p>
            <p>1983年に最初の「手話いろはかるた」が誕生しました。時代の趨勢に合わせて新しい手話かるたを2021年に作りました。</p>
            <p>とても好評ですぐに売り切れて絶版になっていましたが、再販の要望が多数あったため、このたび、増刷することになりました。</p>
          </div>
        </div>

        <!-- かるたの購入フォーム -->
        <form class="checkout-form" action="/api/create-checkout-session" method="POST">
          <input type="hidden" name="product_type" value="karuta">
          <div class="form-group">
            <label for="name-karuta">お名前</label>
            <input type="text" id="name-karuta" name="name" placeholder="山田 太郎" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="postal-karuta">郵便番号</label>
              <input type="text" id="postal-karuta" name="postal" placeholder="530-0001" required>
            </div>
            <div class="form-group">
              <label for="phone-karuta">電話番号</label>
              <input type="text" id="phone-karuta" name="phone" placeholder="09012345678" required>
            </div>
          </div>
          <div class="form-group">
            <label for="address-karuta">お届け先住所</label>
            <input type="text" id="address-karuta" name="address" placeholder="大阪府大阪市北区〇〇 1-2-3" required>
          </div>
          <div class="form-group">
            <label for="email-karuta">メールアドレス（受領確認用）</label>
            <input type="email" id="email-karuta" name="email" placeholder="example@email.com" required>
          </div>
          <button type="submit" class="buy-button">かるたを注文する（クレジットカードで進む）</button>
          <p class="note">※Stripeの安全な決済画面へ移動します</p>
        </form>
      </div>

    </div>
  </div>

</body>
</html>
